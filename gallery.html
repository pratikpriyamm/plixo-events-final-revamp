<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | PlixoEvents</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #FAF9F6;
  margin: 0;
  padding: 40px 20px;
}

.gallery-header {
  text-align: center;
  margin-bottom: 50px;
}

.gallery-header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 3rem;
  color: #333;
}

.back-btn {
  text-decoration: none;
  color: #0E5A5A;
  border: 1px solid #0E5A5A;
  padding: 8px 18px;
  border-radius: 30px;
  display: inline-block;
  margin-bottom: 20px;
  transition: all 0.3s ease;
}

.back-btn:hover {
  background-color: #0E5A5A;
  color: #fff;
}

.gallery-grid {
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 24px;
}

.gallery-grid img {
  width: 100%;
  height: 240px;
  object-fit: cover;
  border-radius: 12px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  transition: transform 0.3s ease;
  background-color: #e0e0e0; /* Loading placeholder color */
}

.gallery-grid img:hover {
  transform: translateY(-5px);
}

/* =========================================
   MOBILE GALLERY (Camera Roll Style)
   ========================================= */
@media (max-width: 768px) {
  .gallery-grid {
    /* Forces exactly 3 columns of equal size */
    grid-template-columns: repeat(3, 1fr); 
    gap: 4px; /* Tighter spacing like a real phone gallery */
    padding: 10px 5px; /* Reduces the bulky edge padding on mobile */
  }

  .gallery-grid img {
    height: auto; 
    aspect-ratio: 1 / 1; /* Forces every image to be a perfect square */
    border-radius: 4px; /* Slightly sharper corners for small thumbnails */
    box-shadow: none; /* Removes shadow for a flatter, native app look */
  }
}

/* Error Message Styling */
.error-msg {
  text-align: center;
  font-size: 1.2rem;
  color: #666;
  grid-column: 1 / -1;
}

/* =========================================
   LIGHTBOX MODAL STYLING (Responsive & Centered)
   ========================================= */
.lightbox {
  display: none; /* JavaScript will change this to 'flex' */
  position: fixed;
  z-index: 2000; /* Sits on top of absolutely everything */
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.95); /* Deep dark overlay */
  backdrop-filter: blur(5px); /* Blurs the website behind it */
  
  /* Flexbox guarantees perfect dead-center alignment */
  align-items: center;      
  justify-content: center;  
  padding: 0; /* Removes the old top padding */
}

/* The Enlarged Image */
.lightbox-content {
  max-width: 95vw; /* Fills most of the screen with a tiny edge buffer */
  max-height: 95vh;
  margin: 0; /* Auto margin removed; Flexbox handles centering */
  border-radius: 8px;
  object-fit: contain; /* Prevents stretching */
  animation: zoomIn 0.3s ease; /* Smooth pop-in effect */
}

@keyframes zoomIn {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* Navigation Buttons (Arrows) */
.lightbox-prev, .lightbox-next {
  cursor: pointer;
  position: absolute;
  top: 50%;
  transform: translateY(-50%); /* Perfect vertical centering */
  width: auto;
  padding: 8px;
  color: white;
  font-weight: bold;
  font-size: 15px;
  background: rgba(0,0,0,0.5);
  border: none;
  border-radius: 4px;
  user-select: none;
  transition: background 0.3s;
  z-index: 2001; /* CRITICAL: Forces arrows ON TOP of the image */
}

/* Push arrows to the absolute edges */
.lightbox-prev { left: 10px; }
.lightbox-next { right: 10px; }

.lightbox-prev:hover, .lightbox-next:hover {
  background-color: rgba(0,0,0,0.9);
}

/* Close Button */
.close-lightbox {
  position: absolute;
  top: 15px;
  right: 25px;
  color: #fff;
  font-size: 40px;
  font-weight: bold;
  cursor: pointer;
  transition: color 0.3s;
  z-index: 2002; /* CRITICAL: Forces close button ON TOP of everything */
}

.close-lightbox:hover { 
  color: var(--accent-teal, #0E5A5A); 
}

/* Make grid images look clickable */
.gallery-grid img {
  cursor: pointer;
}

/* Forces the slider images to fill the container perfectly */
.mySlides {
    width: 100%;
    height: 100%;
    display: none; /* Handled by JS */
}

.mySlides img {
    width: 100%;
    height: 100%;
    max-height: 80vh; /* Adjust this if the slider is too tall */
    object-fit: cover; /* Ensures the image fills the space without stretching */
    display: block;
}

</style>
</head>

<body>

<div class="gallery-header">
  <a href="index.html#highlights" class="back-btn">← Back</a>
  <h1 id="galleryTitle">Loading...</h1>
</div>

<div class="gallery-grid" id="galleryGrid"></div>

<script src="gallery.js"></script> 

    <div id="lightbox-modal" class="lightbox">
      <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
      
      <button class="lightbox-prev" onclick="changeLightboxImage(-1)">&#10094;</button>
      
      <img class="lightbox-content" id="lightbox-img">
      
      <button class="lightbox-next" onclick="changeLightboxImage(1)">&#10095;</button>

</div>

</body>
</html>
